name: wheel_of_names
description: "A new Flutter project."

publish_to: 'Play Store' # Remove this line if you wish to publish to pub.dev

version: 1.0.4+5

environment:
  sdk: '>=3.2.4 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  flutter_fortune_wheel: ^1.3.2
  lottie: ^3.1.3
  
  just_audio: ^0.9.42
  pdf: ^3.11.3
  path_provider: ^2.1.4
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png" # Path to your icon image


flutter:

  
  uses-material-design: true
  assets:

    - assets/images/
    - assets/lottie/
    - assets/sound/

  fonts:
    - family: Heading
      fonts:
        - asset: assets/fonts/Nunito-Black.ttf
    - family: Product-Sans
      fonts:
        - asset: assets/fonts/Product Sans Regular.ttf
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
    - family: RubikMedium
      fonts:
        - asset: assets/fonts/Rubik-Medium.ttf
    - family: Spin
      fonts:
        - asset: assets/fonts/SpicyRice-Regular.ttf
      